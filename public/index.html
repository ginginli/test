<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隐性内耗与情绪耗电量自测</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .hidden { display: none; }
        .poster-bg { background: linear-gradient(135deg, #fffcfc 0%, #fff1f1 100%); }
        .capture-container { width: 100%; max-width: 400px; margin: 0 auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex justify-center items-center">

    <div id="app" class="w-full max-w-md bg-white shadow-xl min-h-screen sm:min-h-[85vh] sm:rounded-2xl relative overflow-hidden flex flex-col">
        
        <!-- 1. 激活码验证区 -->
        <div id="auth-screen" class="p-8 flex flex-col justify-center h-full flex-1">
            <div class="text-center mb-8">
                <div class="text-5xl mb-4">🔋</div>
                <h1 class="text-2xl font-bold text-gray-800 mb-3">隐性内耗指数自测</h1>
                <div class="inline-block bg-red-50 border border-red-100 rounded-full px-3 py-1 mb-4">
                    <p class="text-xs text-red-500 font-bold tracking-widest">基于《高性价比人生指南》研发</p>
                </div>
                <p class="text-sm text-gray-500 mt-2">请输入您的专属激活码进入测试</p>
                <p class="text-xs text-red-400 mt-2 font-medium">⚠️ 激活码只可用于一次测试</p>
            </div>
            <input type="text" id="access-code" placeholder="请输入激活码" class="w-full px-4 py-4 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent text-center font-mono tracking-widest uppercase mb-4 transition bg-gray-50 text-lg">
            <p id="auth-error" class="text-red-500 text-sm text-center hidden mb-4">激活码无效或已被使用，请核对</p>
            <button onclick="verifyCode()" id="verify-btn" class="w-full bg-red-500 text-white font-bold py-4 rounded-xl hover:bg-red-600 transition shadow-lg text-lg">验证并开始测试</button>
        </div>

        <!-- 2. 答题区 -->
        <div id="question-screen" class="hidden flex-1 flex flex-col p-6 bg-white">
            <div class="mb-6">
                <div class="flex justify-between items-end mb-2">
                    <span id="dimension-title" class="text-xs font-bold px-2 py-1 rounded">加载中...</span>
                    <span class="text-sm font-bold text-gray-400"><span id="progress-text" class="text-lg">1</span> / 15</span>
                </div>
                <div class="w-full bg-gray-100 rounded-full h-2">
                    <div id="progress-bar" class="h-2 rounded-full transition-all duration-300" style="width: 6.66%"></div>
                </div>
            </div>
            
            <div class="flex-1">
                <h2 id="question-text" class="text-lg font-bold text-gray-800 mb-6 leading-relaxed"></h2>
                <div id="options" class="space-y-4"></div>
            </div>
        </div>

        <!-- 3. 生成中动画 -->
        <div id="loading-screen" class="hidden p-8 flex flex-col justify-center items-center h-full flex-1 bg-white">
            <div class="animate-spin text-5xl mb-4">⚙️</div>
            <h2 class="text-xl font-bold text-gray-700">正在生成诊断报告...</h2>
            <p class="text-sm text-gray-400 mt-2">分析你的内耗重灾区...</p>
        </div>

        <!-- 4. 结果展示区 -->
        <div id="result-screen" class="hidden flex-col h-full bg-gray-100 overflow-y-auto no-scrollbar">
            
            <!-- 【图1】海报区 (极简无冗余版) -->
            <div class="p-4 pb-2">
                <div id="capture-area" class="capture-container poster-bg p-6 rounded-2xl shadow-sm relative overflow-hidden border border-red-50">
                    <div class="text-center border-b border-red-100 pb-4 mb-6">
                        <p class="text-xs text-red-400 tracking-widest mb-1">PERSONAL ENERGY REPORT</p>
                        <h2 class="text-2xl font-extrabold text-gray-800">隐性内耗诊断书</h2>
                    </div>
                    
                    <div class="flex items-center justify-between bg-white/80 p-5 rounded-xl shadow-sm mb-4">
                        <div class="flex-1 pr-4">
                            <p class="text-sm text-gray-400 mb-1">内耗指数得分</p>
                            <p class="text-4xl font-black text-red-500"><span id="score"></span><span class="text-lg text-gray-400 font-normal"> / 45</span></p>
                            <h3 id="result-title" class="text-lg font-bold text-gray-800 mt-2 leading-tight"></h3>
                        </div>
                        <div id="result-avatar" class="text-6xl drop-shadow-md"></div>
                    </div>

                    <div class="text-center">
                        <p id="result-desc" class="text-sm text-gray-600 leading-relaxed font-medium bg-white/60 p-4 rounded-lg text-left m-0"></p>
                    </div>
                </div>
                
                <!-- 自动化提示文案 -->
                <div id="save-tip" class="hidden mt-4 text-center px-4">
                    <p class="text-xs text-gray-500 font-bold tracking-wide mb-1.5">✨ 画像海报已生成，长按上方图片即可保存</p>
                    <p class="text-xs text-red-400 font-medium">⚠️ 激活码只可用于一次测试，请妥善保存结果，退出后可能无法再次查看结果</p>
                </div>
            </div>

            <!-- 【图2】深度阅读区：全量重灾区展示与专属建议 -->
            <div class="p-4 pt-2">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h4 class="text-base font-bold text-gray-800 mb-5 flex items-center border-b border-gray-50 pb-3">
                        <span class="mr-2">🔍</span>你的内耗重灾区与对症处方
                    </h4>
                    
                    <!-- 动态插入痛点与处方的容器 -->
                    <div id="dynamic-advice-container" class="space-y-4"></div>
                    
                </div>
            </div>
            <div class="pb-8"></div>
        </div>
    </div>

    <script>
        const questions = [
            { d: "维度一：情绪与人际高敏区", q: "Q1：开会或聚餐时说错了一句话，当天晚上你的状态是？", opts: [{t: "A. 经常中枪，反复回想", s: 3}, {t: "B. 偶尔这样，睡一觉就好", s: 1}, {t: "C. 几乎不想，说过就忘", s: 0}],
              advice: "<b>启动“除以二”法则：</b>觉得“全场都在看我出丑”时，把你估计的人数直接除以二。别人真没那么关注你，别在脑补中浪费电量。" },
            { d: "维度一：情绪与人际高敏区", q: "Q2：当你的工作/生活做不到100分时，你是否觉得“别人一定会彻底否定我”？", opts: [{t: "A. 经常这么觉得", s: 3}, {t: "B. 偶尔有这种压力", s: 1}, {t: "C. 尽力就好，不强求完美", s: 0}],
              advice: "<b>切断完美主义执念：</b>把“别人要求我做到完美”当成躯体生病的症状看，绝不要当成必然发生的现实去恐惧。" },
            { d: "维度一：情绪与人际高敏区", q: "Q3：当你看到朋友圈或小红书上，同龄人又升职加薪或到处旅行时，你会？", opts: [{t: "A. 极度焦虑，觉得自己很失败", s: 3}, {t: "B. 羡慕，但过会儿就忘了", s: 1}, {t: "C. 很少比较，或直接给这类App设限", s: 0}],
              advice: "<b>切断比较毒源：</b>习惯向上比较会让情绪变差，立刻给刷同龄人动态的App设定硬上限，把眼睛收回自己的进度条。" },
            { d: "维度一：情绪与人际高敏区", q: "Q4：面对一个总是抱怨、疯狂消耗你的朋友或同事，你通常的反应是？", opts: [{t: "A. 不好意思拒绝，一直忍受", s: 3}, {t: "B. 偶尔附和几句", s: 1}, {t: "C. 果断拒绝，远离消耗型关系", s: 0}],
              advice: "<b>清理消耗源：</b>人际交往是有账本的，一个消耗你的人造成的损失远大于支持者的补给。学会果断拒绝不想接的请求。" },
            { d: "维度一：情绪与人际高敏区", q: "Q5：去办事或就医时遇到工作人员态度不好、流程繁琐，你通常会？", opts: [{t: "A. 非常生气，觉得针对自己，反复复述委屈", s: 3}, {t: "B. 当场生气，但办完就算了", s: 1}, {t: "C. 只关注拿回执记期限，把对方当NPC", s: 0}],
              advice: "<b>启动流程防御：</b>去办事遇到阻碍，把对方当成受规则约束的“NPC”，只靠文书和期限推进，杜绝情绪代入。" },
            
            { d: "维度二：行动与认知瘫痪区", q: "Q6：遇到一件极其糟心、想不通的事情时，你会怎么做？", opts: [{t: "A. 停在原地反复琢磨", s: 3}, {t: "B. 找人疯狂吐槽", s: 1}, {t: "C. 立刻去干点需要动手的活", s: 0}],
              advice: "<b>强制斩断反刍：</b>发现自己在反复回想糟心事时，立刻去干一件需要动手的事（如洗碗打扫），死想是想不通的。" },
            { d: "维度二：行动与认知瘫痪区", q: "Q7：当一个项目或者一段关系已经让你痛苦且没有希望，但你已经投入了三年，你会？", opts: [{t: "A. 觉得沉没成本太高，继续耗着", s: 3}, {t: "B. 纠结犹豫，走一步看一步", s: 1}, {t: "C. 只看未来投入和回报，果断止损", s: 0}],
              advice: "<b>无视沉没成本：</b>决定是否继续死磕时，只算未来投入和回报，已经花掉的钱和时间全部当成0。" },
            { d: "维度二：行动与认知瘫痪区", q: "Q8：当事情发展不如预期，脑子里冒出“完蛋了，全毁了”这种悲观念头时，你觉得？", opts: [{t: "A. 觉得这是对未来的精准预测", s: 3}, {t: "B. 害怕，努力往好处想", s: 1}, {t: "C. 知道这是一种情绪症状，不当成事实", s: 0}],
              advice: "<b>阻断灾难化思维：</b>脑子里冒出“事情肯定会更糟”的念头时，把它当成症状，而不是对未来的准确预判。" },
            { d: "维度二：行动与认知瘫痪区", q: "Q9：当一件事情没有明确的外部截止日期（比如学个技能）时，你通常会？", opts: [{t: "A. 永远挂在脑子里，一直不动手", s: 3}, {t: "B. 等心情好了再做", s: 1}, {t: "C. 自己给它定一个死期限并认账", s: 0}],
              advice: "<b>人造死线：</b>没有外部截止日期的事情，自己硬定一个日期并认账，绝不等心情好了再做。" },
            { d: "维度二：行动与认知瘫痪区", q: "Q10：在做需要连贯思考的工作时，突然收到一条不太紧急的微信，你会？", opts: [{t: "A. 立刻停下来回复", s: 3}, {t: "B. 看一眼，等手头事结束再回", s: 1}, {t: "C. 专注当前，按设定的固定时间批处理", s: 0}],
              advice: "<b>戒除多任务幻觉：</b>任务一切换，反应变慢且易出错，强制自己一次只做一件事，不要随时秒回。" },
            
            { d: "维度三：生理与物理漏电区", q: "Q11：白天受了委屈或感到极度愤怒时，你会选择以下哪种发泄方式？", opts: [{t: "A. 摔东西、疯狂跑步等让身体兴奋的方式", s: 3}, {t: "B. 暴饮暴食", s: 1}, {t: "C. 深呼吸、静坐等让身体慢下来的方式", s: 0}],
              advice: "<b>降火别靠砸：</b>生气时别靠砸东西发泄，那只会让身体更加兴奋；用深呼吸等方式让身体慢下来才能真正消气。" },
            { d: "维度三：生理与物理漏电区", q: "Q12：工作日遇到重大挫折，到了深夜12点，你会？", opts: [{t: "A. 熬夜做重大决定或发要紧消息", s: 3}, {t: "B. 刷短视频逃避", s: 1}, {t: "C. 强迫自己睡觉，推到醒来再说", s: 0}],
              advice: "<b>23:00强制熔断：</b>深夜绝对不做重大决定、不发要紧消息，人在缺觉时极易选择高风险的错误选项。" },
            { d: "维度三：生理与物理漏电区", q: "Q13：在做需要深度思考的工作时，你的手机通常在哪？", opts: [{t: "A. 随时放在手边，来消息就看", s: 3}, {t: "B. 放手边但开静音", s: 1}, {t: "C. 放到视线之外，关掉非必要通知", s: 0}],
              advice: "<b>物理隔离：</b>做深度工作时，把手机放到视线之外。即使不看，手机在旁边也会让大脑认知余量变少。" },
            { d: "维度三：生理与物理漏电区", q: "Q14：睡前躺在床上，你通常会做什么？", opts: [{t: "A. 关灯后继续刷短视频越刷越精神", s: 3}, {t: "B. 看会儿电子书困了睡", s: 1}, {t: "C. 睡前一小时不看发光屏幕", s: 0}],
              advice: "<b>睡前屏幕剥夺：</b>睡前发光屏幕会压低褪黑素，导致第二天生物钟推迟。坚持睡前一小时不看发光屏幕。" },
            { d: "维度三：生理与物理漏电区", q: "Q15：面对海量的群消息、短视频推送，你的习惯是？", opts: [{t: "A. 一响秒回，不断刷新生怕错过", s: 3}, {t: "B. 偶尔集中清理，但常点开推送", s: 1}, {t: "C. 屏蔽非必要通知，给App设硬上限", s: 0}],
              advice: "<b>信息截断：</b>把需要看的信息改成定时集中看。砍掉随时的信息输入，省下来的时间一分不打折。" }
        ];

        // 升级版小红书网感标签
        const tierData = [
            { max: 9, title: "反内耗战神", avatar: "🛡️", desc: "人间清醒，内核稳如老狗。外界的抓马剧情根本破不了你的防，你极其擅长保护自己的注意力和精力。" },
            { max: 18, title: "假性松弛感", avatar: "🔋", desc: "表面云淡风轻，遇到特定雷区秒破防。你的内耗往往被特定的痛点触发词瞬间引爆。" },
            { max: 27, title: "高敏漏电体质", avatar: "🪫", desc: "全网最庞大的职场“海绵体”。表面稳如老狗，内心兵荒马乱。经常因为别人的一句话在心里演完80集连续剧。" },
            { max: 36, title: "无效死磕大师", avatar: "⛓️", desc: "每天的电量在中午就耗尽了。容易被烂人烂事死死拖住，想放弃又舍不得以前的付出，每天都在硬熬。" },
            { max: 45, title: "情绪ICU病号", avatar: "🚨", desc: "警告！你已处于重度透支状态。每天大量的能量都耗在自我攻击上，极易用熬夜或暴饮暴食来报复性回血。" }
        ];

        let currentQ = 0;
        let totalScore = 0;
        let userAnswers = [];

        async function verifyCode() {
            const btn = document.getElementById('verify-btn');
            const codeInput = document.getElementById('access-code').value.trim().toUpperCase();
            const errorMsg = document.getElementById('auth-error');
            
            if (!codeInput) {
                errorMsg.innerText = '请输入激活码';
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.innerHTML = '验证中...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                // 正式向 Vercel 后端发送查验请求
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 验证通过，进入答题
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('question-screen').classList.remove('hidden');
                    showQuestion();
                } else {
                    // 拦截并显示具体的错误原因（如：已被使用、无效）
                    errorMsg.innerText = data.error || '激活码无效或已被使用，请核对';
                    errorMsg.classList.remove('hidden');
                }
            } catch(e) {
                errorMsg.innerText = '网络异常，请重试';
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = '验证并开始测试';
                btn.disabled = false;
            }
        }

        function showQuestion() {
            const qData = questions[currentQ];
            document.getElementById('progress-text').innerText = currentQ + 1;
            document.getElementById('progress-bar').style.width = ((currentQ + 1) / 15 * 100) + "%";
            
            const dimTitle = document.getElementById('dimension-title');
            const progText = document.getElementById('progress-text');
            const progBar = document.getElementById('progress-bar');
            
            dimTitle.className = "text-xs font-bold px-2 py-1 rounded";
            progText.className = "text-lg font-bold";
            progBar.className = "h-2 rounded-full transition-all duration-300";

            let themeText, themeBg, themeBar;
            if (qData.d.includes("维度一")) {
                themeText = "text-blue-500"; themeBg = "bg-blue-50"; themeBar = "bg-blue-400";
            } else if (qData.d.includes("维度二")) {
                themeText = "text-purple-500"; themeBg = "bg-purple-50"; themeBar = "bg-purple-400";
            } else {
                themeText = "text-red-500"; themeBg = "bg-red-50"; themeBar = "bg-red-400";
            }

            dimTitle.classList.add(themeText, themeBg);
            progText.classList.add(themeText);
            progBar.classList.add(themeBar);
            
            document.getElementById('dimension-title').innerText = qData.d;
            document.getElementById('question-text').innerText = qData.q;
            
            const optsDiv = document.getElementById('options');
            optsDiv.innerHTML = '';
            qData.opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-gray-50 border border-gray-200 p-4 rounded-xl hover:bg-gray-100 hover:border-gray-300 transition shadow-sm text-sm font-medium focus:bg-gray-200";
                btn.innerText = opt.t;
                btn.onclick = () => answer(opt.s, qData.advice, qData.q, opt.t);
                optsDiv.appendChild(btn);
            });
        }

        function answer(score, adviceText, qText, optText) {
            totalScore += score;
            userAnswers.push({ score: score, advice: adviceText, question: qText, option: optText });
            currentQ++;
            if (currentQ < questions.length) {
                showQuestion();
            } else {
                processResult();
            }
        }

        function processResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');
            
            setTimeout(() => {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('result-screen').classList.add('flex'); 
                renderResult();
            }, 1500);
        }

        function renderResult() {
            document.getElementById('score').innerText = totalScore;
            let matchedTier = tierData.find(t => totalScore <= t.max);
            document.getElementById('result-title').innerText = matchedTier.title;
            document.getElementById('result-avatar').innerText = matchedTier.avatar;
            document.getElementById('result-desc').innerText = matchedTier.desc;
            
            // 全量找出所有得3分（最耗电）的习惯，不设上限
            let worstHabits = userAnswers.filter(a => a.score === 3);
            
            // 如果一个3分都没有，降级找1分的
            if (worstHabits.length === 0) {
                worstHabits = userAnswers.filter(a => a.score === 1);
            }
            
            // 如果连1分都没有（神仙体质），给兜底建议
            if (worstHabits.length === 0) {
                worstHabits = [
                    { question: "日常状态维护", option: "各方面处理得都很好", advice: "<b>稳固底盘：</b>继续保持固定起床时间（周末也一样），这是你超强续航的基础。" }
                ];
            }

            const adviceContainer = document.getElementById('dynamic-advice-container');
            adviceContainer.innerHTML = '';
            
            // 将符合条件的所有痛点全部渲染出来
            worstHabits.forEach((item, index) => {
                let cleanQ = item.question.replace(/^Q\d+：/, '');
                let block = document.createElement('div');
                block.className = "bg-gray-50 p-4 rounded-xl border border-gray-200";
                block.innerHTML = `
                    <div class="mb-3">
                        <span class="text-xs font-bold text-white bg-gray-800 px-2 py-1 rounded mr-2 align-middle">雷区 ${index + 1}</span>
                        <span class="text-sm font-bold text-gray-800 align-middle">${cleanQ}</span>
                    </div>
                    <div class="text-xs text-gray-500 mb-4 flex items-center bg-white p-2 rounded border border-gray-100 shadow-sm">
                        <span class="mr-2">👉</span> 你的选择：${item.option}
                    </div>
                    <div class="text-sm text-gray-700 leading-relaxed border-t border-gray-200 pt-3">
                        <span class="text-red-500 font-bold mr-1">💊 专属处方：</span>${item.advice}
                    </div>
                `;
                adviceContainer.appendChild(block);
            });

            // 结果渲染完毕后，延迟0.5秒自动将第一部分“画”成图片供保存
            setTimeout(autoGenerateImage, 500);
        }

        function autoGenerateImage() {
            const captureArea = document.getElementById('capture-area');
            html2canvas(captureArea, {
                scale: 2, 
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                // 直接用生成的图片替换原本的DOM结构
                captureArea.innerHTML = `<img src="${imgData}" class="w-full h-auto rounded-2xl shadow-md" alt="你的测试海报">`;
                // 显示“长按保存”的文字提示
                document.getElementById('save-tip').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
